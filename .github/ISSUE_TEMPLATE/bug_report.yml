name: Bug report
description: Something conventional-release does wrong, or a release it broke
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or workflow you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error or the wrong CHANGELOG lines, as text.
      render: text
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The smallest set of commits and config that shows it. A public repo or a `git log --oneline`
        of the commits since the last tag helps most.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`conventional-release --version`, or the `@ref` your workflow calls"
      placeholder: conventional-release 0.1.2
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it ran
      options:
        - CLI, locally
        - reusable workflow (tag.yml / pr-title.yml)
        - both
    validations:
      required: true
